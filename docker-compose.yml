version: '3.8'

services:
  node1:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NODE_ID=1
      - PEERS=node2:8001,node3:8002
    networks:
      - raftnet

  node2:
    build: .
    ports:
      - "8001:8000"
    environment:
      - NODE_ID=2
      - PEERS=node1:8000,node3:8002
    networks:
      - raftnet

  node3:
    build: .
    ports:
      - "8002:8000"
    environment:
      - NODE_ID=3
      - PEERS=node1:8000,node2:8001
    networks:
      - raftnet

networks:
  raftnet:
    driver: bridge